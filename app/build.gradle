plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'id.my.id.cyronime.app'
    compileSdk 34

    // Paksa resolusi versi lama: credentials >=1.5 butuh compileSdk 35
    // (toolchain build saat ini SDK 34). Pasangan 1.3.0 + googleid 1.1.1 stabil.
    configurations.all {
        resolutionStrategy {
            force 'androidx.credentials:credentials:1.3.0'
            force 'androidx.credentials:credentials-play-services-auth:1.3.0'
        }
    }

    defaultConfig {
        applicationId "id.my.id.cyronime.app"
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName "1.3.16"
        // URL backend Cyronime (sama dengan Web) — ubah kalau ada domain sendiri.
        buildConfigField "String", "WEB_URL", "\"https://cyronime.web.id\""
        // Web OAuth client (public, bukan rahasia) — serverClientId Google Sign-In native.
        buildConfigField "String", "WEB_CLIENT_ID", "\"479442842025-ku4c4bbn238idoke95l2h7icjuhfemd2.apps.googleusercontent.com\""
    }

    signingConfigs {
        debug {
            // Keystore debug tetap di repo supaya SHA-1 stabil lintas mesin build
            // (dipakai untuk registrasi OAuth Android + Google Sign-In native).
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // APK yang didistribusi ke pengguna: R8 + shrink resource.
            // Inilah yang membuat scroll Compose jauh lebih ringan dibanding debug.
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Jaringan: OkHttp + org.json (bawaan platform) — tanpa parser berat.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gambar poster
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Player: Media3 ExoPlayer (+ HLS)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'

    // Google Sign-In native (Credential Manager)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-messaging'
}
